# Only Neo4j runs in Docker; the API and web app run natively (PRD 10.1).
# Start: docker compose up -d     Stop: docker compose down
services:
  neo4j:
    image: neo4j:5-community
    container_name: adaptive-rag-neo4j
    ports:
      # Bound to localhost only: not reachable from other machines (PRD security)
      - "127.0.0.1:7474:7474"  # browser UI: http://localhost:7474
      - "127.0.0.1:7687:7687"  # bolt protocol used by the app
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  neo4j-data:
