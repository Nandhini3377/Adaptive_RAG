[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nandhini3377", email = "nandhini23012003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7.4",
    "onnxruntime<1.24",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
]

[project.scripts]
adaptive-rag = "adaptive_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
