[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nandhini3377", email = "nandhini23012003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.7.4",
    "markdown-it-py>=4.2.0",
    "onnxruntime<1.24",
    "openai>=3.26.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
]

[project.scripts]
adaptive-rag = "adaptive_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = ["live: calls a real external API (costs credits)"]
filterwarnings = [
    # PyMuPDF's compiled bindings trigger this on import; harmless
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
